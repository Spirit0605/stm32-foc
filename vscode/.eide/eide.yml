      defineList:
        - USE_HAL_DRIVER
        - ARM_MATH_CM4
        - STM32F407xx
      incList:
        - .
        - ../Core/Inc
        - ../FreeRTOS/Inc
        - ../Drivers/STM32F4xx_HAL_Driver/Inc
        - ../Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
